# The shop moved to Cloudflare Pages. Netlify only redirects visitors there (no real build).
[build]
  command = "mkdir -p nf && echo moved > nf/index.html"
  publish = "nf"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/*"
  to = "https://kbeauty-afg.pages.dev/:splat"
  status = 301
  force = true
